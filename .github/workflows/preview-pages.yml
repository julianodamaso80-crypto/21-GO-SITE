name: preview-redesign
on:
  workflow_dispatch:
  push:
    branches: [redesign-cinematografico]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-preview
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Instalar deps
        working-directory: 21go-website
        env: { PUPPETEER_SKIP_DOWNLOAD: "true" }
        run: npm ci --legacy-peer-deps
      - name: Baixar midia cinematografica (30MB)
        working-directory: 21go-website
        run: |
          mkdir -p public/media
          curl -fsSL --retry 3 -o /tmp/media.zip "https://d2ol7oe51mr4n9.cloudfront.net/user_3GoeKQh1bDj5LzenOoPGmI2rV9E/a301d304-ad3b-468f-9788-5d272647414e.zip"
          unzip -o -q /tmp/media.zip -d public/media
          ls public/media | wc -l
      - name: Preparar export estatico (preview)
        working-directory: 21go-website
        run: |
          rm -rf src/app/api src/app/robots.ts src/app/sitemap.ts
          echo "preview: rotas de API removidas SOMENTE neste build estatico"
      - name: Build
        working-directory: 21go-website
        env:
          PREVIEW_EXPORT: "1"
          BASE_PATH: /21-GO-SITE
          NEXT_PUBLIC_PREVIEW: "1"
          PUPPETEER_SKIP_DOWNLOAD: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: 21go-website/out }
      - id: deployment
        uses: actions/deploy-pages@v4
